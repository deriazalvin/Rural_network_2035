<!DOCTYPE html>
<html>
<head>
    <title>Ajouter Données Test Historique</title>
</head>
<body>
    <h1>Ajout de données de test à l'historique</h1>
    <button onclick="addTestData()">Ajouter Données de Test</button>
    <button onclick="clearHistory()">Effacer Historique</button>
    <button onclick="showHistory()">Afficher Historique</button>
    <div id="result"></div>

    <script>
        function addTestData() {
            const testData = [
                {
                    id: 'opt_' + Date.now(),
                    distanceTotale: 125.5,
                    coutTotal: 45000,
                    gainPercentage: 15.7,
                    nbTournees: 3,
                    nbCamions: 3,
                    tournees: [
                        {
                            name: 'Tournée A',
                            distanceTotale: 45.2,
                            chargeTotale: 1200,
                            etapes: [
                                { nomVillage: 'Village 1', productionCollectee: 450 },
                                { nomVillage: 'Village 2', productionCollectee: 380 },
                                { nomVillage: 'Village 3', productionCollectee: 370 }
                            ]
                        },
                        {
                            name: 'Tournée B',
                            distanceTotale: 42.8,
                            chargeTotale: 1150,
                            etapes: [
                                { nomVillage: 'Village 4', productionCollectee: 420 },
                                { nomVillage: 'Village 5', productionCollectee: 380 }
                            ]
                        }
                    ],
                    villagesNonDesservis: ['Village 6'],
                    dateHeure: new Date().toISOString()
                },
                {
                    id: 'opt_' + (Date.now() - 86400000),
                    distanceTotale: 98.3,
                    coutTotal: 38000,
                    gainPercentage: 22.4,
                    nbTournees: 2,
                    nbCamions: 2,
                    tournees: [
                        {
                            name: 'Tournée C',
                            distanceTotale: 38.7,
                            chargeTotale: 980,
                            etapes: [
                                { nomVillage: 'Village 7', productionCollectee: 380 },
                                { nomVillage: 'Village 8', productionCollectee: 320 }
                            ]
                        }
                    ],
                    villagesNonDesservis: [],
                    dateHeure: new Date(Date.now() - 86400000).toISOString()
                }
            ];

            const key = 'rn_optimisations';
            const existing = JSON.parse(localStorage.getItem(key) || '[]');
            const updated = [...testData, ...existing];
            localStorage.setItem(key, JSON.stringify(updated));
            
            document.getElementById('result').innerHTML = 
                '<p style="color: green;">✅ Données de test ajoutées ! ' + testData.length + ' optimisations.</p>';
        }

        function clearHistory() {
            localStorage.removeItem('rn_optimisations');
            document.getElementById('result').innerHTML = 
                '<p style="color: orange;">🗑️ Historique effacé.</p>';
        }

        function showHistory() {
            const key = 'rn_optimisations';
            const data = JSON.parse(localStorage.getItem(key) || '[]');
            document.getElementById('result').innerHTML = 
                '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
        }
    </script>
</body>
</html>
