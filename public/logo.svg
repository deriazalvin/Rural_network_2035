<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5016;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b9d4a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)"/>

  <!-- Agricultural field (waves) -->
  <path d="M 20 60 Q 30 55, 40 60 T 60 60 T 80 60"
        fill="none" stroke="#f5f1e8" stroke-width="2"/>
  <path d="M 20 65 Q 30 60, 40 65 T 60 65 T 80 65"
        fill="none" stroke="#f5f1e8" stroke-width="2"/>

  <!-- Truck -->
  <rect x="35" y="35" width="25" height="15" rx="2" fill="#ffffff"/>
  <circle cx="40" cy="52" r="4" fill="#374151"/>
  <circle cx="55" cy="52" r="4" fill="#374151"/>

  <!-- Route path -->
  <path d="M 15 75 Q 25 70, 35 75 T 55 75 T 75 75 T 85 75"
        fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="5,5"/>

  <!-- Network nodes -->
  <circle cx="25" cy="30" r="3" fill="#fbbf24"/>
  <circle cx="50" cy="25" r="3" fill="#fbbf24"/>
  <circle cx="75" cy="30" r="3" fill="#fbbf24"/>

  <!-- Connections -->
  <line x1="25" y1="30" x2="50" y2="25" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  <line x1="50" y1="25" x2="75" y2="30" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
</svg>
